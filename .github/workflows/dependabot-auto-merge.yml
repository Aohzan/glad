---
name: Dependabot auto-merge

on: pull_request_target # zizmor: ignore[dangerous-triggers] reusable workflow only reads PR metadata, never checks out PR code

permissions: {}

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: xt0rted/.github/.github/workflows/dependabot-auto-merge.yml@cb2d8c639d7292c04de6e740bf557e7b8f751f7f # main 2025-09-08
    secrets:
      GITHUB_APP_ID: ${{ secrets.BOT_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
