{% load i18n %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ back_url }}" class="btn btn-sm btn-outline-secondary">
    {% icon "arrow-left" "me-1" %}{{ back_label }}
  </a>
  <h1 class="h4 mb-0 ms-1">
    {% if is_edit %}
      {% icon "pencil" "me-1" %}{{ edit_title }}
    {% else %}
      {% icon "circle-plus" "me-1" %}{{ new_title }}
    {% endif %}
  </h1>
</div>
