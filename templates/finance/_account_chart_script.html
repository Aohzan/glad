{% load i18n %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const CHART_URL = '{{ chart_url }}';
  var currencyCode = '{{ account.currency|default:"EUR" }}';

  function formatCurrency(val) {
    return new Intl.NumberFormat(document.documentElement.lang || navigator.language, {
      style: 'currency', currency: currencyCode, maximumFractionDigits: 0
    }).format(val);
  }

  function isDarkMode() {
    return document.documentElement.getAttribute('data-bs-theme') === 'dark';
  }

  function renderWhenVisible(element, renderFn) {
    if (!element) { renderFn(); return; }
    if (!('IntersectionObserver' in window)) { renderFn(); return; }
    var observer = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        renderFn();
        observer.disconnect();
      }
    }, { threshold: 0.1 });
    observer.observe(element);
  }

  function buildDepositAnnotations(deposits, withLabel) {
    var dark = isDarkMode();
    return (deposits || []).map(function(d) {
      var ann = {
        x: new Date(d.date).getTime(),
        borderColor: dark ? '#fbbf24' : '#d97706',
        borderWidth: 1.5,
        strokeDashArray: 4,
      };
      if (withLabel) {
        ann.label = {
          text: (d.value >= 0 ? '+' : '') + formatCurrency(d.value),
          style: {
            fontSize: '10px',
            background: 'transparent',
            color: dark ? '#fbbf24' : '#d97706',
            padding: { top: 2, bottom: 2, left: 4, right: 4 },
          },
          orientation: 'horizontal',
          position: 'top',
          offsetY: 8,
        };
      }
      return ann;
    });
  }

  fetch(CHART_URL, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(r => r.json())
    .then(data => {
      if (!data.success) return;

      const holdingPalette = ['#a78bfa', '#34d399', '#f472b6', '#60a5fa', '#fb923c', '#facc15', '#22d3ee', '#c084fc'];
      const otherColor = '#94a3b8';

      // Sort holdings descending by last value: largest first = rendered at bottom of stack
      var rawHoldings = (data.holdings_series || []).slice().sort(function(a, b) {
        var lastA = a.data.length ? a.data[a.data.length - 1].value : 0;
        var lastB = b.data.length ? b.data[b.data.length - 1].value : 0;
        return lastB - lastA;
      });

      // Compute total of last values to determine threshold for "Other" grouping
      var grandTotal = 0;
      rawHoldings.forEach(function(h) {
        grandTotal += h.data.length ? h.data[h.data.length - 1].value : 0;
      });
      var smallThreshold = grandTotal * 0.03; // 3% of total

      // Separate Cash (always kept as its own series), big holdings, and small holdings
      var cashHolding = null;
      var bigHoldings = [];
      var smallHoldings = [];
      rawHoldings.forEach(function(h) {
        if (h.name === '{% translate "Cash" %}') {
          cashHolding = h;
        } else {
          var lastVal = h.data.length ? h.data[h.data.length - 1].value : 0;
          if (lastVal >= smallThreshold) {
            bigHoldings.push(h);
          } else {
            smallHoldings.push(h);
          }
        }
      });

      // Build "Other" series from small holdings (summed per date)
      var otherHolding = null;
      if (smallHoldings.length > 0) {
        var otherDataMap = {};
        smallHoldings.forEach(function(h) {
          h.data.forEach(function(d) {
            if (!otherDataMap[d.date]) otherDataMap[d.date] = 0;
            otherDataMap[d.date] += d.value;
          });
        });
        var otherData = Object.keys(otherDataMap).sort().map(function(date) {
          return { date: date, value: otherDataMap[date] };
        });
        otherHolding = { name: '{% translate "Other" %}', data: otherData };
      }

      // Final ordered list: big holdings (descending), Other, Cash (on top)
      var displayHoldings = bigHoldings.slice();
      if (otherHolding) displayHoldings.push(otherHolding);
      if (cashHolding) displayHoldings.push(cashHolding);

      // Donut includes all holdings (including Cash) so "Total" label is accurate
      var holdingsOnly = displayHoldings;

      var series = displayHoldings.map(function(h) {
        return { name: h.name, data: h.data.map(function(d) { return { x: d.date, y: d.value }; }) };
      });
      var colors = displayHoldings.map(function(h, i) {
        if (h.name === '{% translate "Other" %}') return otherColor;
        var idx = bigHoldings.indexOf(h);
        return idx >= 0 ? holdingPalette[idx % holdingPalette.length] : (cashHolding && h === cashHolding ? holdingPalette[bigHoldings.length % holdingPalette.length] : otherColor);
      });

      // Pre-compute a date->total lookup from data.values (includes cash) for the tooltip
      var totalByDate = {};
      (data.values || []).forEach(function(v) { totalByDate[v.date] = v.value; });

      // Pre-compute a date->invested lookup for the tooltip
      var investedByDate = {};
      (data.invested || []).forEach(function(v) { investedByDate[v.date] = v.value; });

      // Compute shared x-axis range so both charts align vertically
      var allChartDates = [];
      (data.values || []).forEach(function(v) { allChartDates.push(v.date); });
      (data.invested || []).forEach(function(v) { allChartDates.push(v.date); });
      displayHoldings.forEach(function(h) {
        h.data.forEach(function(d) { allChartDates.push(d.date); });
      });
      var xMin, xMax;
      if (allChartDates.length) {
        allChartDates.sort();
        xMin = new Date(allChartDates[0]).getTime();
        xMax = new Date(allChartDates[allChartDates.length - 1]).getTime();
      }

      // Deposit annotations: with labels on evolution chart, lines only on composition chart
      var depositAnnotationsWithLabel = buildDepositAnnotations(data.deposits, true);
      var depositAnnotationsNoLabel = buildDepositAnnotations(data.deposits, false);

      // ── Composition chart (stacked area) ────────────────────────────────
      var chartEl = document.getElementById('accountChart');
      var chart = new ApexCharts(chartEl, {
        chart: {
          type: 'area',
          height: 300,
          background: 'transparent',
          toolbar: { show: true },
          zoom: { enabled: true },
          stacked: true,
          group: 'accountCharts',
          animations: { enabled: true, speed: 600 },
        },
        theme: { mode: isDarkMode() ? 'dark' : 'light' },
        series: series,
        annotations: { xaxis: depositAnnotationsNoLabel },
        xaxis: { type: 'datetime', labels: { datetimeUTC: false }, min: xMin, max: xMax },
        yaxis: { labels: { formatter: formatCurrency } },
        dataLabels: { enabled: false },
        stroke: { curve: 'smooth', width: 1.5 },
        fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.6, opacityTo: 0.2 } },
        colors: colors,
        tooltip: {
          theme: isDarkMode() ? 'dark' : 'light',
          shared: true,
          intersect: false,
          custom: function(opts) {
            var s = opts.series, dpi = opts.dataPointIndex, w = opts.w;
            var dark = isDarkMode();
            var bg = dark ? '#0f172a' : '#fff';
            var border = dark ? 'rgba(255,255,255,.12)' : '#dee2e6';
            var textMuted = dark ? '#adb5bd' : '#6c757d';

            var ts = null;
            for (var si = 0; si < w.globals.seriesX.length; si++) {
              if (w.globals.seriesX[si][dpi] != null) {
                ts = w.globals.seriesX[si][dpi];
                break;
              }
            }
            var dateStr = ts != null ? new Date(ts).toISOString().slice(0, 10) : '';

            // Compute seriesSum from raw data for robustness against null data points
            var seriesSum = 0;
            displayHoldings.forEach(function(h) {
              h.data.forEach(function(d) {
                if (d.date === dateStr) seriesSum += d.value;
              });
            });
            var total = totalByDate[dateStr] != null ? totalByDate[dateStr] : seriesSum;

            var label = '';
            if (ts != null) {
              try { label = new Date(ts).toLocaleDateString(navigator.language || 'fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e) {}
            }

            var rows = '';
            for (var j = 0; j < s.length; j++) {
              var val = s[j][dpi];
              if (val == null || val === 0) continue;
              var color = w.globals.colors[j];
              rows += '<div style="display:flex;justify-content:space-between;gap:16px;padding:2px 0;">' +
                '<span style="display:flex;align-items:center;gap:6px;color:' + textMuted + ';font-size:12px;">' +
                  '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';flex-shrink:0;"></span>' +
                  w.globals.seriesNames[j] +
                '</span>' +
                '<span style="font-weight:600;font-size:12px;">' + formatCurrency(val) + '</span>' +
              '</div>';
            }

            var invVal = investedByDate[dateStr];
            var gainVal = invVal != null ? total - invVal : null;
            var gainPct = (invVal != null && invVal !== 0) ? (gainVal / invVal * 100) : null;
            var gainColor = gainVal != null && gainVal >= 0 ? (dark ? '#4ade80' : '#16a34a') : (dark ? '#f87171' : '#dc2626');

            if (invVal != null) {
              rows += '<div style="display:flex;justify-content:space-between;gap:16px;padding:4px 0 0;margin-top:4px;border-top:1px solid ' + border + ';">' +
                '<span style="color:' + textMuted + ';font-size:12px;">{% translate "Invested" %}</span>' +
                '<span style="font-weight:600;font-size:12px;">' + formatCurrency(invVal) + '</span>' +
              '</div>';
              if (gainVal != null) {
                rows += '<div style="display:flex;justify-content:space-between;gap:16px;padding:2px 0;">' +
                  '<span style="color:' + textMuted + ';font-size:12px;">{% translate "Capital gain" %}</span>' +
                  '<span style="font-weight:600;font-size:12px;color:' + gainColor + ';">' +
                    formatCurrency(gainVal) +
                    (gainPct != null ? ' <span style="font-size:11px;">(' + (gainPct >= 0 ? '+' : '') + gainPct.toFixed(1) + '%)</span>' : '') +
                  '</span>' +
                '</div>';
              }
            }

            return '<div style="background:' + bg + ';border:1px solid ' + border + ';border-radius:8px;padding:10px 14px;min-width:200px;box-shadow:0 4px 12px rgba(0,0,0,.15);">' +
              '<div style="font-weight:700;margin-bottom:6px;font-size:13px;">' + label + '</div>' +
              '<div style="display:flex;justify-content:space-between;gap:16px;padding:4px 0 6px;border-bottom:1px solid ' + border + ';margin-bottom:6px;">' +
                '<span style="font-size:13px;font-weight:600;">{% translate "Total" %}</span>' +
                '<span style="font-size:13px;font-weight:700;">' + formatCurrency(total) + '</span>' +
              '</div>' +
              rows +
            '</div>';
          },
        },
        grid: { borderColor: isDarkMode() ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)' },
        legend: {
          show: true,
          position: 'top',
          fontSize: '12px',
          fontFamily: 'inherit',
          labels: { colors: isDarkMode() ? '#adb5bd' : '#6c757d' },
          markers: { width: 10, height: 10, radius: 2 },
          itemMargin: { horizontal: 8, vertical: 2 },
        },
      });

      // ── Evolution chart (Total vs Invested line) ────────────────────────
      var evolutionSeries = [];
      var hasValues = (data.values || []).length > 0;
      var hasInvested = (data.invested || []).length > 0;

      if (hasValues) {
        evolutionSeries.push({
          name: '{% translate "Total" %}',
          data: data.values.map(function(v) { return { x: v.date, y: v.value }; }),
        });
      }
      if (hasInvested) {
        evolutionSeries.push({
          name: '{% translate "Invested" %}',
          data: data.invested.map(function(v) { return { x: v.date, y: v.value }; }),
        });
      }

      var evolutionChart = null;
      var evolutionEl = document.getElementById('accountEvolutionChart');
      if (evolutionEl && evolutionSeries.length > 0) {
        var evoColors = [];
        if (hasValues) evoColors.push(isDarkMode() ? '#60a5fa' : '#2563eb');
        if (hasInvested) evoColors.push(isDarkMode() ? '#fbbf24' : '#d97706');

        evolutionChart = new ApexCharts(evolutionEl, {
          chart: {
            type: 'line',
            height: 220,
            background: 'transparent',
            toolbar: { show: true },
            zoom: { enabled: true },
            group: 'accountCharts',
            animations: { enabled: true, speed: 600 },
          },
          theme: { mode: isDarkMode() ? 'dark' : 'light' },
          series: evolutionSeries,
          colors: evoColors,
          annotations: { xaxis: depositAnnotationsWithLabel },
          stroke: {
            curve: 'smooth',
            width: [2.5, 2],
            dashArray: [0, 6],
          },
          xaxis: { type: 'datetime', labels: { datetimeUTC: false }, min: xMin, max: xMax },
          yaxis: { labels: { formatter: formatCurrency } },
          dataLabels: { enabled: false },
          tooltip: {
            theme: isDarkMode() ? 'dark' : 'light',
            shared: true,
            intersect: false,
            custom: function(opts) {
              var s = opts.series, dpi = opts.dataPointIndex, w = opts.w;
              var dark = isDarkMode();
              var bg = dark ? '#0f172a' : '#fff';
              var border = dark ? 'rgba(255,255,255,.12)' : '#dee2e6';
              var textMuted = dark ? '#adb5bd' : '#6c757d';

              var ts = null;
              for (var si = 0; si < w.globals.seriesX.length; si++) {
                if (w.globals.seriesX[si][dpi] != null) {
                  ts = w.globals.seriesX[si][dpi];
                  break;
                }
              }
              var dateStr = ts != null ? new Date(ts).toISOString().slice(0, 10) : '';
              var label = '';
              if (ts != null) {
                try { label = new Date(ts).toLocaleDateString(navigator.language || 'fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e) {}
              }

              var totalVal = null, invVal = null;
              for (var i = 0; i < w.globals.seriesNames.length; i++) {
                if (w.globals.seriesNames[i] === '{% translate "Total" %}') totalVal = s[i][dpi];
                if (w.globals.seriesNames[i] === '{% translate "Invested" %}') invVal = s[i][dpi];
              }

              var rows = '';
              if (totalVal != null) {
                rows += '<div style="display:flex;justify-content:space-between;gap:16px;padding:2px 0;">' +
                  '<span style="display:flex;align-items:center;gap:6px;color:' + textMuted + ';font-size:12px;">' +
                    '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + w.globals.colors[0] + ';flex-shrink:0;"></span>' +
                    '{% translate "Total" %}</span>' +
                  '<span style="font-weight:600;font-size:12px;">' + formatCurrency(totalVal) + '</span>' +
                '</div>';
              }
              if (invVal != null) {
                rows += '<div style="display:flex;justify-content:space-between;gap:16px;padding:2px 0;">' +
                  '<span style="display:flex;align-items:center;gap:6px;color:' + textMuted + ';font-size:12px;">' +
                    '<span style="display:inline-block;width:8px;height:2px;border-radius:1px;background:' + w.globals.colors[1] + ';flex-shrink:0;"></span>' +
                    '{% translate "Invested" %}</span>' +
                  '<span style="font-weight:600;font-size:12px;">' + formatCurrency(invVal) + '</span>' +
                '</div>';
              }

              if (totalVal != null && invVal != null) {
                var gainVal = totalVal - invVal;
                var gainPct = invVal !== 0 ? (gainVal / invVal * 100) : null;
                var gainColor = gainVal >= 0 ? (dark ? '#4ade80' : '#16a34a') : (dark ? '#f87171' : '#dc2626');
                rows += '<div style="display:flex;justify-content:space-between;gap:16px;padding:4px 0 0;margin-top:4px;border-top:1px solid ' + border + ';">' +
                  '<span style="color:' + textMuted + ';font-size:12px;">{% translate "Capital gain" %}</span>' +
                  '<span style="font-weight:600;font-size:12px;color:' + gainColor + ';">' +
                    formatCurrency(gainVal) +
                    (gainPct != null ? ' <span style="font-size:11px;">(' + (gainPct >= 0 ? '+' : '') + gainPct.toFixed(1) + '%)</span>' : '') +
                  '</span>' +
                '</div>';
              }

              return '<div style="background:' + bg + ';border:1px solid ' + border + ';border-radius:8px;padding:10px 14px;min-width:200px;box-shadow:0 4px 12px rgba(0,0,0,.15);">' +
                '<div style="font-weight:700;margin-bottom:6px;font-size:13px;">' + label + '</div>' +
                rows +
              '</div>';
            },
          },
          grid: { borderColor: isDarkMode() ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)' },
          legend: {
            show: true,
            position: 'top',
            fontSize: '12px',
            fontFamily: 'inherit',
            labels: { colors: isDarkMode() ? '#adb5bd' : '#6c757d' },
            markers: { width: 10, height: 10, radius: 2 },
            itemMargin: { horizontal: 8, vertical: 2 },
          },
        });
      }

      // ── Donut — current holdings breakdown (includes Cash) ──────────────
      const donutEl = document.getElementById('accountDonut');
      let donut = null;
      if (donutEl && holdingsOnly.length) {
        const donutValues = holdingsOnly.map(function(h) {
          return h.data.length ? h.data[h.data.length - 1].value : 0;
        });
        const donutLabels = holdingsOnly.map(function(h) { return h.name; });
        const donutColors = holdingsOnly.map(function(h, i) {
          if (h.name === '{% translate "Other" %}') return otherColor;
          var idx = bigHoldings.indexOf(h);
          return idx >= 0 ? holdingPalette[idx % holdingPalette.length] : otherColor;
        });
        donut = new ApexCharts(donutEl, {
          chart: { type: 'donut', height: 260, background: 'transparent', animations: { enabled: true, speed: 600 } },
          series: donutValues,
          labels: donutLabels,
          colors: donutColors,
          fill: {
            type: 'gradient',
            gradient: {
              shade: isDarkMode() ? 'dark' : 'light',
              type: 'diagonal1',
              shadeIntensity: 0.4,
              opacityFrom: 1,
              opacityTo: 0.75,
            },
          },
          plotOptions: { pie: { donut: { size: '62%', borderRadius: 5, spacing: 2, labels: {
            show: true,
            total: {
              show: true,
              label: '{% translate "Total" %}',
              fontSize: '12px',
              fontWeight: 600,
              formatter: function(w) {
                var sum = w.globals.seriesTotals.reduce(function(a, b) { return a + b; }, 0);
                return formatCurrency(sum);
              },
            },
            value: { fontSize: '13px', fontWeight: 700, formatter: formatCurrency },
          } } } },
          dataLabels: { enabled: false },
          legend: { show: false },
          tooltip: { theme: isDarkMode() ? 'dark' : 'light', y: { formatter: formatCurrency } },
          stroke: { width: 0 },
        });
        renderWhenVisible(donutEl, function() {
          donut.render().then(function() {
            var dColors = donut.w.globals.colors;
            var colorMap = {};
            donutLabels.forEach(function(name, i) { colorMap[name] = dColors[i]; });
            document.querySelectorAll('[data-holding-name]').forEach(function(el) {
              if (el.tagName !== 'TD') return;
              var color = colorMap[el.dataset.holdingName];
              if (!color) return;
              var sq = document.createElement('span');
              sq.style.cssText = 'display:inline-block;width:10px;height:10px;border-radius:2px;background:' + color + ';margin-right:6px;vertical-align:middle;flex-shrink:0;';
              el.insertBefore(sq, el.firstChild);
            });
          });
        });
      }

      // Render charts when visible (deferred for performance)
      renderWhenVisible(chartEl, function() { chart.render(); });
      if (evolutionChart) {
        renderWhenVisible(evolutionEl, function() { evolutionChart.render(); });
      }

      window.updateChartsTheme = function(themeName) {
        var dark = themeName === 'dark';
        chart.updateOptions({
          theme: { mode: dark ? 'dark' : 'light' },
          chart: { background: 'transparent' },
          tooltip: { theme: dark ? 'dark' : 'light' },
          grid: { borderColor: dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)' },
          legend: { labels: { colors: dark ? '#adb5bd' : '#6c757d' } },
          annotations: { xaxis: buildDepositAnnotations(data.deposits, false) },
        });
        if (evolutionChart) {
          var evoColors2 = [];
          if (hasValues) evoColors2.push(dark ? '#60a5fa' : '#2563eb');
          if (hasInvested) evoColors2.push(dark ? '#fbbf24' : '#d97706');
          evolutionChart.updateOptions({
            theme: { mode: dark ? 'dark' : 'light' },
            chart: { background: 'transparent' },
            tooltip: { theme: dark ? 'dark' : 'light' },
            grid: { borderColor: dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)' },
            legend: { labels: { colors: dark ? '#adb5bd' : '#6c757d' } },
            colors: evoColors2,
            annotations: { xaxis: buildDepositAnnotations(data.deposits, true) },
          });
        }
        if (donut) {
          donut.updateOptions({
            theme: { mode: dark ? 'dark' : 'light' },
            tooltip: { theme: dark ? 'dark' : 'light' },
            fill: { type: 'gradient', gradient: { shade: dark ? 'dark' : 'light' } },
          });
        }
      };
    })
    .catch(function() {
      document.getElementById('accountChart').innerHTML = '<p class="text-center text-muted py-4"><i class="bi bi-exclamation-circle me-1"></i>{% translate "Could not load chart data." %}</p>';
    });
});
</script>
