{% load i18n static %}
<!DOCTYPE html>
<html data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 - {% translate "Server Error" %} - Glad</title>
    <link rel="icon" href="{% static 'glad-mark.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'vendors/figtree/figtree.css' %}">
    <link rel="stylesheet" href="{% static 'vendors/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/glad-tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/glad.css' %}">
</head>
<body class="g-app">
    <main class="g-auth">
        <div class="g-card g-error">
            <span class="g-error__code g-neg">500</span>
            <h1 class="g-h2">{% translate "Server Error" %}</h1>
            <p class="g-muted mb-0">{% translate "An unexpected error occurred. Please try again later." %}</p>
            <a href="/" class="btn btn-primary">{% translate "Back to Home" %}</a>
        </div>
    </main>
</body>
</html>
