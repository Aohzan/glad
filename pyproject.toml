[project]
name = "glad"
version = "1.2.0"
description = "Web app to follow its investments and properties"

authors = [{ name = "Aohzan", email = "aohzan@gmail.com" }]
maintainers = [{ name = "Aohzan", email = "aohzan@gmail.com" }]

readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE.md" }

dependencies = [
    "django>=6.0.3",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.35.0",
    "servestatic>=4.3.4", # ASGI-native static file serving
    "psycopg[binary]>=3.1.18", # PostgreSQL adapter
    "dateparser>=1.2.2",
    "django-money>=3.5.4",
    "webauthn>=2.1.0",
    "yfinance>=1.7.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2", # YAML fixtures loaded at startup (loaddata)
    "fpdf2>=2.8.8",
]

[project.optional-dependencies]
build = ["python-semantic-release>=10.0"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.13.4",
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.15.1",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-django>=4.11.1",
    "pytest-picked>=0.5.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
    "types-python-dateutil>=2.9.0",
]

[tool.semantic_release]
# Bump the version in pyproject.toml, refresh uv.lock accordingly and stage it so
# `uv sync --locked` keeps working after the release commit.
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version} [skip ci]"
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
allow_zero_version = false

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^chore\\(deps",
    "^chore\\(semantic-release\\):",
]

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "glad.settings"

[tool.coverage.run]
branch = true
relative_files = true
source = ["accounts", "base", "finance", "property"]
omit = ["*/migrations/*", "*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
include = ["."]
exclude = [
    "**/__pycache__",
    "**/migrations",
    "**/node_modules",
    "**/.*",
    ".venv",
    "venv",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
ignore = [
    "DTZ001",  # Django handles timezones via USE_TZ
    "DTZ002",
    "DTZ005",
    "DTZ007",
    "DTZ011",
    "BLE001",  # Blind except is common in Django views
    "S110",    # try-except-pass is often intentional
    "RUF012",  # Mutable class attributes are standard in Django admin/models
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glad*", "accounts*", "base*", "finance*", "property*"]
exclude = ["data*", "locale*", "static*", "templates*"]
